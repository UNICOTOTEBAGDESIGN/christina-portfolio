<!doctype html><html><head><meta charset="UTF-8"><title>母版视线素材核对</title><style>body{margin:0;background:#62517d;color:#fff9ee;font:15px Arial}h1,p{margin:18px 24px}section{display:grid;grid-template-columns:repeat(9,1fr);gap:10px;margin:18px}figure{margin:0;border:1px solid #ffffff20;background:#493b5a;border-radius:12px;overflow:hidden}figure img{display:block;width:100%;height:230px;object-fit:cover;object-position:50% 25%;transform:scale(1.5);transform-origin:50% 30%}figcaption{padding:12px;text-align:center;position:relative;background:#493b5a}@media(max-width:1000px){section{grid-template-columns:repeat(3,1fr)}}button{margin:8px;padding:12px;border:0;border-radius:20px;cursor:pointer}#live{display:flex;justify-content:center;gap:32px}#live img{height:420px;width:310px;object-fit:contain;transform:scale(1.3);transform-origin:50% 30%}#live>div{overflow:hidden;border:1px dashed #fff6;height:420px}#directions{text-align:center}</style></head><body><h1>同一母版 · 只改变视线</h1><p>头部角度、肤色、明暗、位置、比例和外轮廓均来自母版。完整和撕开版本均只保留头和短脖子，带白边。</p><div id="directions"></div><div id="live"><div><img id="whole"></div><div><img id="open"></div></div><h1>完整照片</h1><section id="full"></section><h1>撕开照片</h1><section id="torn"></section><script>const dirs=['center','n','ne','e','se','s','sw','w','nw'];const root='/portrait/master-v10/';function show(d){document.querySelector('#whole').src=root+'full/'+d+'.svg?revision=master-v10b';document.querySelector('#open').src=root+'torn/'+d+'.svg?revision=master-v10b';document.body.dataset.gaze=d}document.querySelector('#directions').innerHTML=dirs.map(d=>'<button data-dir="'+d+'">'+d+'</button>').join('');document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.dir));for(const kind of ['full','torn'])document.getElementById(kind).innerHTML=dirs.map(d=>'<figure><img src="'+root+kind+'/'+d+'.svg?revision=master-v10b"><figcaption>'+d+'</figcaption></figure>').join('');show('center');</script></body></html>
