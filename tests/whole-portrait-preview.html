<!doctype html><html lang="zh"><meta charset="UTF-8"><title>整张照片 · 白纸描边与撕口核对</title><style>body{margin:0;background:#62517d;color:#fff9ee;font:15px Arial}h1,p{margin:18px 24px}#buttons{text-align:center}button{margin:6px;padding:12px 17px;border:0;border-radius:24px;cursor:pointer}.pair{display:flex;justify-content:center;gap:32px;margin:20px auto}.pair figure{width:310px;height:430px;margin:0;overflow:hidden;border:1px dashed #fff5;position:relative}.pair img{display:block;width:100%;height:100%;object-fit:contain;scale:1.5;transform-origin:50% 30%}.pair figcaption{position:absolute;bottom:8px;left:12px;font-size:12px}.grid{margin:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.grid figure{margin:0;overflow:hidden;border-radius:14px;background:#493b5a;text-align:center}.grid img{width:100%;height:250px;object-fit:cover;object-position:50% 30%;scale:1.5;transform-origin:50% 30%}.grid figcaption{position:relative;background:#493b5a;padding:12px}@media(max-width:850px){.pair{gap:12px}.pair figure{width:44vw;height:350px}.grid{grid-template-columns:repeat(3,1fr)}}</style><h1>整张照片 · 完整 / 撕开</h1><p>每个方向均为独立完整照片，自带厚白纸边；撕开版本自带纸纤维毛边。网页直接切换整图。</p><div id="buttons"></div><div class="pair"><figure><img id="full-live"><figcaption>完整 · 短脖子</figcaption></figure><figure><img id="torn-live"><figcaption>撕开 · 纸纤维边缘</figcaption></figure></div><h1>完整版本</h1><section class="grid" id="full"></section><h1>撕开版本</h1><section class="grid" id="torn"></section><script>const dirs=['center','n','ne','e','se','s','sw','w','nw','surprise'];const root='/portrait/whole-v11/';function show(d){for(const k of ['full','torn'])document.getElementById(k+'-live').src=root+k+'/'+d+'.svg';document.body.dataset.gaze=d}document.getElementById('buttons').innerHTML=dirs.map(d=>'<button data-dir="'+d+'">'+d+'</button>').join('');document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.dir));for(const kind of ['full','torn'])document.getElementById(kind).innerHTML=dirs.map(d=>'<figure><img src="'+root+kind+'/'+d+'.svg"><figcaption>'+d+'</figcaption></figure>').join('');show('center');</script></html>
