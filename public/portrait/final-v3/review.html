<!doctype html><html lang="zh"><meta charset="utf-8"><title>新版头像素材核对</title><style>body{background:#62517d;color:#fff9ee;font-family:Arial;margin:24px}h1{font-size:24px}section{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}figure{margin:0;background:#493b5a;border-radius:12px;overflow:hidden}figcaption{text-align:center;padding:10px}.thumb{height:240px;overflow:hidden;position:relative}.thumb img{position:absolute;width:190%;max-width:none;transform:translate(-23.7%,-7%)}h2{font-size:18px;margin-top:28px}@media(min-width:1100px){section{grid-template-columns:repeat(8,minmax(0,1fr))}.thumb{height:225px}}</style><h1>新版头像 · 完整 / 撕开 / 惊讶</h1><div id="assets"></div><script>const dirs=['center','n','ne','e','se','s','sw','w','nw'];document.getElementById('assets').innerHTML=['full','torn'].map(kind=>'<h2>'+(kind==='full'?'完整头像（带脖子）':'撕开头像（带脖子）')+'</h2><section>'+dirs.map(d=>'<figure><div class="thumb"><img src="'+kind+'/'+d+'.svg"></div><figcaption>'+d.toUpperCase()+'</figcaption></figure>').join('')+'</section>').join('')+'<h2>张嘴惊讶</h2><section><figure><div class="thumb"><img src="surprise.svg"></div><figcaption>Surprise</figcaption></figure><figure><div class="thumb"><img src="torn/surprise.svg"></div><figcaption>Surprise torn</figcaption></figure></section>';</script></html>
